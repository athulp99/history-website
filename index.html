<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A first look at Earth's 4.54-billion-year history."
    />
    <title>History of Earth</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="stars" aria-hidden="true"></div>

      <header class="intro">
        <p class="eyebrow">A cosmic history</p>
        <h1>History of Earth</h1>
        <p class="lede">
          4.54 billion years, traced from the birth of our planet to the world we know today.
        </p>
      </header>

      <section class="timeline-section" aria-labelledby="timeline-heading">
        <h2 id="timeline-heading" class="visually-hidden">Earth history timeline</h2>
        <div class="timeline" role="img" aria-label="Timeline from Earth forms 4.54 billion years ago to present day 2026">
          <div class="timeline-line" aria-hidden="true"></div>

          <article class="timeline-event timeline-event--start">
            <div class="event-marker" aria-hidden="true"></div>
            <div class="event-copy">
              <p class="event-date">4.54 billion years ago</p>
              <h3>Earth forms</h3>
            </div>
          </article>

          <article class="timeline-event timeline-event--end">
            <div class="event-marker" aria-hidden="true"></div>
            <div class="event-copy">
              <p class="event-date">2026</p>
              <h3>Present day</h3>
            </div>
          </article>
        </div>
      </section>

      <p class="scroll-cue">The story begins here</p>
    </main>
  </body>
</html>
